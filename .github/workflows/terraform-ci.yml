name: "Terraform CI"

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.tftest.hcl"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  validate-scan-test:
    name: "Validate, Scan & Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # 1. Format & Lint
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      # 2. Init & Validate (No remote state backend required)
      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        continue-on-error: true

      # 3. Checkov Security Scan
      - name: Run Checkov Security Scan
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          framework: terraform
          output_format: cli
          soft_fail: true

      # 4. Trivy Security Scan (SARIF for GitHub Security Tab)
      - name: Run Trivy Scanner (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "misconfig,secret"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      # 5. Trivy HTML Report Artifact
      - name: Generate Trivy HTML Report
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "misconfig,secret"
          format: "template"
          template: "@/contrib/html.tpl"
          output: "trivy-report.html"

      - name: Upload Trivy HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-report
          path: trivy-report.html

      # 6. Native Terraform Tests (.tftest.hcl)
      - name: Run Native Terraform Tests
        id: test
        run: terraform test -no-color
        continue-on-error: true

      # 7. Post PR Feedback Comment
      - name: Post PR Summary Comment
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### Terraform CI Results
            * **Format Check (\`terraform fmt\`):** \`${{ steps.fmt.outcome }}\`
            * **Initialization (\`terraform init\`):** \`${{ steps.init.outcome }}\`
            * **Validation (\`terraform validate\`):** \`${{ steps.validate.outcome }}\`
            * **Checkov Scan:** \`${{ steps.checkov.outcome }}\`
            * **Trivy Scan:** Completed (Uploaded to Security Tab & Artifacts)
            * **Terraform Tests (\`terraform test\`):** \`${{ steps.test.outcome }}\`

            <details><summary>Show Validation Details</summary>

            \`\`\`
            ${{ steps.validate.outputs.stdout || steps.validate.outputs.stderr || 'No validation errors' }}
            \`\`\`

            </details>

            <details><summary>Show Test Details</summary>

            \`\`\`
            ${{ steps.test.outputs.stdout || steps.test.outputs.stderr || 'No test output' }}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }} | Event: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # 8. Pipeline Gatekeeper (Fail if core steps errored)
      - name: Pipeline Gatekeeper
        if: |
          steps.fmt.outcome == 'failure' ||
          steps.init.outcome == 'failure' ||
          steps.validate.outcome == 'failure' ||
          steps.test.outcome == 'failure'
        run: |
          echo "One or more critical validation or unit test steps failed."
          exit 1
