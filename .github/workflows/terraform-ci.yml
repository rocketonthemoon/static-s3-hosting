name: "Terraform CI"

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.tftest.hcl"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-scan-test:
    name: "Validate, Scan & Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # 1. Format & Lint
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      # 2. Init & Validate
      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        continue-on-error: true

      # 3. Checkov Security Scan
      - name: Run Checkov Security Scan
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          soft_fail: true

      - name: Render Checkov Report to Summary
        uses: b-zurg/sarif-to-markdown@v1
        if: always()
        continue-on-error: true
        with:
          file-path: checkov-results.sarif
          add-job-summary: true

      - name: Upload Checkov Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-security-report
          path: checkov-results.sarif

      # 4. SAST Code Scan (Trivy)
      - name: Run Trivy vulnerability scanner (FS / SAST)
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,config'
          format: 'sarif'
          output: 'trivy-sast-results.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Render Trivy SAST Report to Summary
        uses: b-zurg/sarif-to-markdown@v1
        if: always()
        continue-on-error: true
        with:
          file-path: 'trivy-sast-results.sarif'
          add-job-summary: true

      - name: Archive Trivy SAST SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sast-report
          path: trivy-sast-results.sarif

      # 5. Native Terraform Tests (.tftest.hcl)
      - name: Run Native Terraform Tests
        id: test
        run: terraform test -no-color
        continue-on-error: true

      # 6. Publish Overall Workflow Summary
      - name: Publish Workflow Summary Header
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### 🚀 Terraform CI Summary Overview

          | Step | Status |
          |---|---|
          | 🎨 **Format Check (`terraform fmt`)** | `${{ steps.fmt.outcome }}` |
          | ⚙️ **Initialization (`terraform init`)** | `${{ steps.init.outcome }}` |
          | ✅ **Validation (`terraform validate`)** | `${{ steps.validate.outcome }}` |
          | 🛡️ **Checkov Security Scan** | `${{ steps.checkov.outcome }}` |
          | 🔍 **Trivy SAST Scan** | `${{ steps.trivy.outcome }}` |
          | 🧪 **Terraform Tests (`terraform test`)** | `${{ steps.test.outcome }}` |

          #### 📌 Downloadable Artifacts
          - **Checkov Security Report**: `checkov-security-report` (`checkov-results.sarif`)
          - **Trivy SAST Report**: `trivy-sast-report` (`trivy-sast-results.sarif`)
          EOF

      # 7. Pipeline Gatekeeper (Fail if core steps errored)
      - name: Pipeline Gatekeeper
        if: |
          steps.fmt.outcome == 'failure' ||
          steps.init.outcome == 'failure' ||
          steps.validate.outcome == 'failure' ||
          steps.test.outcome == 'failure'
        run: |
          echo "One or more critical validation or unit test steps failed."
          exit 1
